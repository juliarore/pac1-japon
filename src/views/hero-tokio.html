<section class="hero-tokio">
    <picture class="hero-tokio__picture">
        <!-- Mobile -->
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-tokio-mobile.jpg?w=768&as=avif"
            type="image/avif">
        
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-tokio-mobile.jpg?w=768&as=webp"
            type="image/webp">
        
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-tokio-mobile.jpg?w=768">

        <!-- Tablet -->
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-tokio-tablet.jpg?w=1024&as=avif"
            type="image/avif">
        
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-tokio-tablet.jpg?w=1024&as=webp"
            type="image/webp">
        
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-tokio-tablet.jpg?w=1024">

        <!-- Desktop -->
        <source
            srcset="
                ./assets/images/hero-tokio-desktop.jpg?w=1920&as=avif 1x,
                ./assets/images/hero-tokio-desktop.jpg?w=3840&as=avif 2x
            "
            type="image/avif">
        
        <source
            srcset="
                ./assets/images/hero-tokio-desktop.jpg?w=1920&as=webp 1x,
                ./assets/images/hero-tokio-desktop.jpg?w=3840&as=webp 2x
            "
            type="image/webp">
        
        <source
            srcset="
                ./assets/images/hero-tokio-desktop.jpg?w=1920 1x,
                ./assets/images/hero-tokio-desktop.jpg?w=3840 2x
            ">

        <!-- Fallback JPG -->        
        <img
            src="./assets/images/hero-tokio-desktop.jpg?w=1920"
            alt="Vista de Tokio al atardecer con la torre Tokyo Skytree"
            class="hero-tokio__image"
            width="1920"
            height="1080"
            loading="eager">
    </picture>

    <div class="hero-tokio__content animate__animated animate__fadeInDown">
        <h1 class="hero-tokio__title o-title--h1">Tokio (días 1-5)</h1>
        <p class="hero-tokio__subtitle subtitle">Tokio en cinco días: lo esencial para una primera toma de contacto con Japón.</p>
    </div>
</section>
