<section class="hero-tokio">
    <picture class="hero-tokio__picture">
        <!-- Mobile -->
        <source
            media="(max-width: 768px)"
            srcset="
                ./assets/images/hero-tokio-mobile.jpg?w=768&as=avif 768w,
                ./assets/images/hero-tokio-mobile.jpg?w=480&as=avif 480w
            "
            type="image/avif">
        
        <source
            media="(max-width: 768px)"
            srcset="
                ./assets/images/hero-tokio-mobile.jpg?w=768&as=webp 768w,
                ./assets/images/hero-tokio-mobile.jpg?w=480&as=webp 480w
            "
            type="image/webp">
        
        <source
            media="(max-width: 768px)"
            srcset="
                ./assets/images/hero-tokio-mobile.jpg?w=768 768w,
                ./assets/images/hero-tokio-mobile.jpg?w=480 480w
            ">

        <!-- Tablet -->
        <source
            media="(max-width: 1024px)"
            srcset="
                ./assets/images/hero-tokio-tablet.jpg?w=1024&as=avif 1024w
            "
            type="image/avif">
        
        <source
            media="(max-width: 1024px)"
            srcset="
                ./assets/images/hero-tokio-tablet.jpg?w=1024&as=webp 1024w
            "
            type="image/webp">
        
        <source
            media="(max-width: 1024px)"
            srcset="
                ./assets/images/hero-tokio-tablet.jpg?w=1024 1024w
            ">

        <!-- Desktop -->
        <source
            srcset="
                ./assets/images/hero-tokio-desktop.jpg?w=1920&as=avif 1920w,
                ./assets/images/hero-tokio-desktop.jpg?w=1400&as=avif 1400w
            "
            type="image/avif">
        
        <source
            srcset="
                ./assets/images/hero-tokio-desktop.jpg?w=1920&as=webp 1920w,
                ./assets/images/hero-tokio-desktop.jpg?w=1400&as=webp 1400w
            "
            type="image/webp">
        
        <source
            srcset="
                ./assets/images/hero-tokio-desktop.jpg?w=1920 1920w,
                ./assets/images/hero-tokio-desktop.jpg?w=1400 1400w
            ">

        <!-- Fallback JPG -->        
        <img 
            src="./assets/images/hero-tokio-desktop.jpg" 
            alt="Vista de Tokio al atardecer con la torre Tokyo Skytree"
            class="hero-tokio__image"
            loading="eager">
    </picture>

    <div class="hero-tokio__content animate__animated animate__fadeInDown">
        <h1 class="hero-tokio__title o-title--h1">Tokio (días 1-5)</h1>
        <p class="hero-tokio__subtitle subtitle">Tokio en cinco días: lo esencial para una primera toma de contacto con Japón.</p>
    </div>
</section>
