<section class="hero-contact">
    <picture class="hero-contact__picture">
        <!-- Mobile -->
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-contact.jpg?w=768&as=avif"
            type="image/avif">
        
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-contact.jpg?w=768&as=webp"
            type="image/webp">
        
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-contact.jpg?w=768">

        <!-- Tablet -->
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-contact.jpg?w=1024&as=avif"
            type="image/avif">
        
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-contact.jpg?w=1024&as=webp"
            type="image/webp">
        
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-contact.jpg?w=1024">

        <!-- Desktop -->
        <source
            srcset="
                ./assets/images/hero-contact.jpg?w=1600&as=avif 1x,
                ./assets/images/hero-contact.jpg?w=3200&as=avif 2x
            "
            type="image/avif">
        
        <source
            srcset="
                ./assets/images/hero-contact.jpg?w=1600&as=webp 1x,
                ./assets/images/hero-contact.jpg?w=3200&as=webp 2x
            "
            type="image/webp">
        
        <source
            srcset="
                ./assets/images/hero-contact.jpg?w=1600 1x,
                ./assets/images/hero-contact.jpg?w=3200 2x
            ">

        <!-- Fallback JPG -->
        <img
            src="./assets/images/hero-contact.jpg?w=1600"
            alt="Flores de cerezo rosas en primavera"
            class="hero-contact__image"
            width="1920"
            height="1080"
            loading="eager"
            fetchpriority="high">
    </picture>

    <div class="hero-contact__content animate__animated animate__fadeInDown">
        <h1 class="hero-contact__title o-title--h1">Contacto</h1>
        <p class="hero-contact__subtitle subtitle">Estamos aquí para resolver cualquier duda sobre tu viaje a Japón.</p>
    </div>
</section>
