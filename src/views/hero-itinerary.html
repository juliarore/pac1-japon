<section class="hero-itinerary">
    <picture class="hero-itinerary__picture">
        <!-- Mobile: AVIF -->
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-itinerary-mobile.jpg?w=768&as=avif"
            type="image/avif">
        
        <!-- Mobile: WebP -->
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-itinerary-mobile.jpg?w=768&as=webp"
            type="image/webp">
        
        <!-- Mobile: JPEG fallback -->
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-itinerary-mobile.jpg?w=768">

        <!-- Tablet: AVIF -->
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-itinerary-tablet.jpg?w=1024&as=avif"
            type="image/avif">
        
        <!-- Tablet: WebP -->
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-itinerary-tablet.jpg?w=1024&as=webp"
            type="image/webp">
        
        <!-- Tablet: JPEG fallback -->
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-itinerary-tablet.jpg?w=1024">

        <!-- Desktop: AVIF -->
        <source
            srcset="
                ./assets/images/hero-itinerary-desktop.jpg?w=1600&as=avif 1x,
                ./assets/images/hero-itinerary-desktop.jpg?w=3200&as=avif 2x
            "
            type="image/avif">
        
        <!-- Desktop: WebP -->
        <source
            srcset="
                ./assets/images/hero-itinerary-desktop.jpg?w=1600&as=webp 1x,
                ./assets/images/hero-itinerary-desktop.jpg?w=3200&as=webp 2x
            "
            type="image/webp">
        
        <!-- Desktop: JPEG fallback -->
        <source
            srcset="
                ./assets/images/hero-itinerary-desktop.jpg?w=1600 1x,
                ./assets/images/hero-itinerary-desktop.jpg?w=3200 2x
            ">

        <!-- Fallback JPG -->
        <img
            src="./assets/images/hero-itinerary-desktop.jpg?w=1600"
            alt="Fosa de Chidorigafuchi en Tokio durante la temporada de cerezos en flor"
            class="hero-itinerary__image"
            width="1920"
            height="1080"
            loading="eager"
            fetchpriority="high">
    </picture>

    <div class="hero-itinerary__content animate__animated animate__fadeInDown">
        <h1 class="hero-itinerary__title o-title--h1">Itinerario del viaje</h1>
        <p class="hero-itinerary__subtitle subtitle">Descubre cada etapa de tu viaje por Japón.</p>
    </div>    
</section>
