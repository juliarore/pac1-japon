<section class="hero-kioto-nara">
    <picture class="hero-kioto-nara__picture">
        <!-- Mobile -->
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-kioto-mobile.jpg?w=768&as=avif"
            type="image/avif">
        
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-kioto-mobile.jpg?w=768&as=webp"
            type="image/webp">
        
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-kioto-mobile.jpg?w=768">

        <!-- Tablet -->
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-kioto-tablet.jpg?w=1024&as=avif"
            type="image/avif">
        
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-kioto-tablet.jpg?w=1024&as=webp"
            type="image/webp">
        
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-kioto-tablet.jpg?w=1024">

        <!-- Desktop -->
        <source
            srcset="
                ./assets/images/hero-kioto-desktop.jpg?w=1920&as=avif 1x,
                ./assets/images/hero-kioto-desktop.jpg?w=3840&as=avif 2x
            "
            type="image/avif">
        
        <source
            srcset="
                ./assets/images/hero-kioto-desktop.jpg?w=1920&as=webp 1x,
                ./assets/images/hero-kioto-desktop.jpg?w=3840&as=webp 2x
            "
            type="image/webp">
        
        <source
            srcset="
                ./assets/images/hero-kioto-desktop.jpg?w=1920 1x,
                ./assets/images/hero-kioto-desktop.jpg?w=3840 2x
            ">

        <!-- Fallback JPG -->        
        <img
            src="./assets/images/hero-kioto-desktop.jpg?w=1920"
            alt="Vista de un templo tradicional en Kioto al atardecer"
            class="hero-kioto-nara__image"
            width="1920"
            height="1080"
            loading="eager">
            
    </picture>

    <div class="hero-kioto-nara__content animate__animated animate__fadeInDown">
        <h1 class="hero-kioto-nara__title o-title--h1">Kioto y Nara <span class="hero-kioto-nara__line-break">(días 6-10)</span></h1>
        <p class="hero-kioto-nara__subtitle subtitle">Entre jardines, templos y calles con encanto, descubre Kioto y Nara.</p>
    </div>
</section>
