<section class="hero-resources">
    <picture class="hero-resources__picture">
        <!-- Mobile -->
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-resources-mobile.jpg?w=768&as=avif"
            type="image/avif">
        
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-resources-mobile.jpg?w=768&as=webp"
            type="image/webp">
        
        <source
            media="(max-width: 768px)"
            srcset="./assets/images/hero-resources-mobile.jpg?w=768">

        <!-- Tablet -->
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-resources-tablet.jpg?w=1024&as=avif"
            type="image/avif">
        
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-resources-tablet.jpg?w=1024&as=webp"
            type="image/webp">
        
        <source
            media="(max-width: 1024px)"
            srcset="./assets/images/hero-resources-tablet.jpg?w=1024">

        <!-- Desktop -->
        <source
            srcset="
                ./assets/images/hero-resources-desktop.jpg?w=1600&as=avif 1x,
                ./assets/images/hero-resources-desktop.jpg?w=3200&as=avif 2x
            "
            type="image/avif">
        
        <source
            srcset="
                ./assets/images/hero-resources-desktop.jpg?w=1600&as=webp 1x,
                ./assets/images/hero-resources-desktop.jpg?w=3200&as=webp 2x
            "
            type="image/webp">
        
        <source
            srcset="
                ./assets/images/hero-resources-desktop.jpg?w=1600 1x,
                ./assets/images/hero-resources-desktop.jpg?w=3200 2x
            ">

        <!-- Fallback JPG -->
        <img
            src="./assets/images/hero-resources-desktop.jpg?w=1600"
            alt="Templo japonés tradicional con flores de cerezo y ramas en primer plano"
            class="hero-resources__image"
            width="1920"
            height="1080"
            loading="eager"
            fetchpriority="high">
    </picture>

    <div class="hero-resources__content animate__animated animate__fadeInDown">
        <h1 class="hero-resources__title o-title--h1">Recursos</h1>
        <p class="hero-resources__subtitle subtitle">En esta página se detallan todos los recursos y herramientas utilizadas para el desarrollo del sitio web.</p>
    </div>
</section>
